[project]
name = "coho-codegen"
version = "2026.1.0a1"
description = "Generate a typed Python content library from your Coho content types, and create one from the template."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "codegen", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
coho-codegen = "coho_codegen.cli:main"

[project.urls]
Homepage = "https://github.com/coho-cms/coho-delivery-sdk-python"
Source = "https://github.com/coho-cms/coho-delivery-sdk-python"
Issues = "https://github.com/coho-cms/coho-delivery-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_codegen"]
# The template is bundled in by the publish workflow, and is git-ignored, so it is named
# here to be packed even though git does not track it.
artifacts = ["src/coho_codegen/template/**"]
