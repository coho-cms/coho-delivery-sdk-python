[project]
name = "coho-delivery-sdk"
version = "2026.2.0a1"
description = "Read Coho content from Python: the delivery client, and the runtime generated content libraries call."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "delivery", "content"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/coho-cms/coho-delivery-sdk-python"
Source = "https://github.com/coho-cms/coho-delivery-sdk-python"
Issues = "https://github.com/coho-cms/coho-delivery-sdk-python/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_delivery_sdk"]
